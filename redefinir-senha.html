<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="theme-color" content="#ffffff">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: dark)">
  <meta name="msapplication-navbutton-color" content="#ffffff">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    (function () {
      var root = document.documentElement;
      root.style.backgroundColor = '#ffffff';
      root.style.colorScheme = 'light';
      root.removeAttribute('data-theme');
      function paintWhite() {
        var list = document.querySelectorAll('meta[name="theme-color"]');
        if (!list.length) {
          var m = document.createElement('meta');
          m.setAttribute('name', 'theme-color');
          m.setAttribute('content', '#ffffff');
          document.head.appendChild(m);
          return;
        }
        for (var i = 0; i < list.length; i++) list[i].setAttribute('content', '#ffffff');
      }
      paintWhite();
      document.addEventListener('DOMContentLoaded', paintWhite);
    })();
  </script>
  <meta name="description" content="Redefinir senha — PowerApps Sistemas">
  <title>Redefinir senha | PowerApps Sistemas</title>
  <link rel="stylesheet" href="css/style.css?v=185">
  <link rel="icon" href="assets/Power2.png" type="image/png">
</head>
<body class="auth-fixed auth-chrome">
  <div class="auth-page">
    <div class="auth-panel">
      <div class="auth-card">
        <div class="auth-card__header">
          <span class="logo-badge logo-badge--lg">
            <img src="assets/Power2.png" alt="PowerApps" width="56" height="56">
          </span>
          <p class="brand-name brand-name--auth">Power<span>Apps</span></p>
          <p>Sistemas</p>
        </div>

        <form id="reset-form" novalidate>
          <p class="form-hint" style="margin-bottom:0.85rem;">
            Defina uma nova senha para a sua conta.
          </p>
          <div class="form-group">
            <label for="reset-password">Nova senha</label>
            <div class="password-field input-with-icon">
              <span class="input-icon input-icon--lock" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input id="reset-password" type="password" required minlength="6"
                placeholder="********" autocomplete="new-password">
              <button type="button" class="password-toggle" id="toggle-reset-password" aria-label="Mostrar senha" title="Mostrar senha">
                <svg class="password-toggle__icon password-toggle__icon--show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="password-toggle__icon password-toggle__icon--hide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="reset-password2">Confirmar senha</label>
            <div class="password-field input-with-icon">
              <span class="input-icon input-icon--lock" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input id="reset-password2" type="password" required minlength="6"
                placeholder="********" autocomplete="new-password">
              <button type="button" class="password-toggle" id="toggle-reset-password2" aria-label="Mostrar senha" title="Mostrar senha">
                <svg class="password-toggle__icon password-toggle__icon--show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="password-toggle__icon password-toggle__icon--hide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>
          <p id="reset-error" class="form-error" hidden></p>
          <button class="btn btn-primary btn-block ripple" type="submit" id="reset-submit-btn">Salvar nova senha</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=10"></script>
  <script src="js/store.js?v=9"></script>
  <script src="js/frontend-api.js?v=34"></script>
  <script src="js/ui.js?v=31"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const token = String(params.get('token') || '').trim();
      const form = document.getElementById('reset-form');
      const errorEl = document.getElementById('reset-error');
      const pass1 = document.getElementById('reset-password');
      const pass2 = document.getElementById('reset-password2');

      function wireToggle(btnId, input) {
        const btn = document.getElementById(btnId);
        if (!btn || !input) return;
        btn.addEventListener('click', () => {
          const show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          btn.classList.toggle('is-visible', show);
          btn.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
          btn.setAttribute('title', show ? 'Ocultar senha' : 'Mostrar senha');
        });
      }
      wireToggle('toggle-reset-password', pass1);
      wireToggle('toggle-reset-password2', pass2);

      if (!token) {
        if (errorEl) {
          errorEl.textContent = 'Link inválido ou incompleto. Solicite uma nova redefinição no login.';
          errorEl.hidden = false;
        }
        form?.querySelectorAll('input,button[type="submit"]').forEach((el) => {
          el.disabled = true;
        });
        return;
      }

      form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (errorEl) errorEl.hidden = true;
        const a = String(pass1?.value || '');
        const b = String(pass2?.value || '');
        if (a.length < 6) {
          if (errorEl) {
            errorEl.textContent = 'A senha deve ter no mínimo 6 caracteres.';
            errorEl.hidden = false;
          }
          return;
        }
        if (a !== b) {
          if (errorEl) {
            errorEl.textContent = 'As senhas não coincidem.';
            errorEl.hidden = false;
          }
          return;
        }

        UI.showLoading('Salvando...');
        try {
          const res = await API.resetPassword({ token, password: a });
          if (!res.ok) {
            UI.hideLoading();
            if (errorEl) {
              errorEl.textContent = res.error || 'Não foi possível redefinir.';
              errorEl.hidden = false;
            }
            UI.toast(res.error || 'Falha ao redefinir.', 'error');
            return;
          }
          // Sai da tela de redefinição e impede voltar com o token já usado
          window.location.replace('index.html?motivo=senha-redefinida');
        } catch (err) {
          UI.hideLoading();
          const msg = err?.message || 'Falha de conexão.';
          if (errorEl) {
            errorEl.textContent = msg;
            errorEl.hidden = false;
          }
          UI.toast(msg, 'error');
        }
      });
    });
  </script>
  <script src="js/offline-guard.js?v=6"></script>
</body>
</html>

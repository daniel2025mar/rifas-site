        <h2>1. Sobre o sistema e finalidade</h2>
        <p>
          O <strong>PowerApps Sistemas</strong> foi desenvolvido para <strong>ajudar na organiza&ccedil;&atilde;o
          de a&ccedil;&otilde;es beneficentes e sorteios empresariais</strong>, por meio de ferramentas de
          gest&atilde;o de rifas (cadastro, vendas, reservas, acompanhamento e sorteio).
          Ao utilizar o sistema, voc&ecirc; declara ter lido estes Termos de Uso e concorda com as
          restri&ccedil;&otilde;es legais descritas abaixo.
        </p>
        <p><strong>Este sistema se destina principalmente a:</strong></p>
        <ul>
          <li>
            <strong>Pessoas f&iacute;sicas ou grupos</strong> que promovem a&ccedil;&otilde;es beneficentes

            m&eacute;dico ou outra necessidade comprov&aacute;vel de ajuda;
          </li>
          <li>
            <strong>Empresas (CNPJ)</strong> que realizam sorteios internos para <strong>colaboradores</strong>
            ou a&ccedil;&otilde;es promocionais para <strong>clientes</strong>, com regras claras e
            finalidade empresarial leg&iacute;tima.
          </li>
        </ul>
        <p>
          O software <strong>n&atilde;o</strong> foi concebido para rifas sem causa definida, entretenimento
          comercial gen&eacute;rico, jogos de azar, apostas ou qualquer uso que desvirtue essas finalidades.
        </p>

        <h2>2. Restri&ccedil;&atilde;o et&aacute;ria &mdash; proibido para menores de idade</h2>

          Ao criar conta ou continuar no sistema, voc&ecirc; declara, sob sua responsabilidade,

        </p>

          <ul>
            <li>
              <strong>Estatuto da Crian&ccedil;a e do Adolescente (ECA &mdash; Lei n&ordm; 8.069/1990):</strong>
              protege crian&ccedil;as e adolescentes (at&eacute; 18 anos incompletos) e veda pr&aacute;ticas
              que coloquem menores em situa&ccedil;&atilde;o de risco ou exposi&ccedil;&atilde;o a atividades
              incompat&iacute;veis com sua prote&ccedil;&atilde;o integral, incluindo participa&ccedil;&atilde;o
              em sorteios, jogos de azar e modalidades semelhantes quando n&atilde;o autorizadas por lei.
            </li>
            <li>
              <strong>C&oacute;digo Civil (Lei n&ordm; 10.406/2002):</strong>
              a maioridade e a plena capacidade civil s&atilde;o atingidas aos 18 anos. Antes disso,
              o menor n&atilde;o pode assumir, por conta pr&oacute;pria, obriga&ccedil;&otilde;es deste tipo
              de plataforma.
            </li>
            <li>
              <strong>Lei Geral de Prote&ccedil;&atilde;o de Dados (LGPD &mdash; Lei n&ordm; 13.709/2018):</strong>
              imp&otilde;e tratamento especial e restritivo de dados pessoais de crian&ccedil;as e
              adolescentes, refor&ccedil;ando que este ambiente n&atilde;o se destina a esse p&uacute;blico.
            </li>
            <li>
              <strong>C&oacute;digo de Defesa do Consumidor (Lei n&ordm; 8.078/1990):</strong>
              prev&ecirc; prote&ccedil;&atilde;o refor&ccedil;ada a consumidores vulner&aacute;veis, incluindo
              menores, vedando pr&aacute;ticas abusivas e exigindo clareza nas informa&ccedil;&otilde;es prestadas.
            </li>
          </ul>
          <p>
            O titular do sistema pode bloquear ou encerrar contas quando houver ind&iacute;cio de
            uso por menor de idade ou de informa&ccedil;&otilde;es falsas sobre a idade.
          </p>

        <h2>3. N&atilde;o &eacute; sistema de apostas ou jogos de azar</h2>
        <p>
          <strong>O PowerApps Sistemas n&atilde;o &eacute;, em hip&oacute;tese alguma, uma plataforma de

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="theme-color" content="#ffffff">
  <title>Confirmar identidade | PowerApps Sistemas</title>
  <link rel="stylesheet" href="css/style.css?v=190">
  <link rel="icon" href="assets/logo.png" type="image/png">
</head>
<body class="auth-fixed auth-chrome">
  <div class="auth-page">
    <div class="auth-panel">
      <div class="auth-card">
        <div class="auth-card__header">
          <span class="logo-badge logo-badge--sm">
            <img src="assets/logo.png" alt="PowerApps Sistemas" width="32" height="32">
          </span>
          <h1>Confirmar identidade</h1>
          <p>
            Para continuar, informe seu <strong>CPF</strong> e a
            <strong>data de nascimento</strong>. Usamos esses dados para confirmar
            que voc&ecirc; tem 18 anos ou mais.
          </p>
        </div>

        <div id="idade-blocked" class="form-error" hidden></div>

        <form id="confirmar-idade-form" novalidate>
          <div class="form-group">
            <label for="cpf">CPF *</label>
            <input id="cpf" name="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00"
              maxlength="14" autocomplete="off" required aria-required="true">
            <p class="form-hint" style="margin-top:0.35rem;">Obrigat&oacute;rio para identifica&ccedil;&atilde;o.</p>
          </div>
          <div class="form-group">
            <label for="dataNascimento-trigger">Data de nascimento *</label>
            <div class="pas-date-picker" data-max-today="true" data-min-year="1900">
              <input type="hidden" id="dataNascimento" name="dataNascimento" required aria-required="true">
              <button type="button" class="pas-date-picker__trigger" id="dataNascimento-trigger" aria-label="Selecionar data de nascimento">
                <span class="pas-date-picker__label">Selecione a data</span>
                <span class="pas-date-picker__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                  </svg>
                </span>
              </button>
            </div>
          </div>
          <div class="form-group form-group--consent">
            <label class="consent-check">
              <input id="idadeDeclaracao" name="idadeDeclaracao" type="checkbox" value="1">
              <span>Declaro que as informa&ccedil;&otilde;es fornecidas s&atilde;o verdadeiras e que sou maior de 18 anos</span>
            </label>
          </div>
          <p id="idade-error" class="form-error" hidden></p>
          <button class="btn btn-primary btn-block ripple" type="submit" id="btn-confirmar-idade" disabled>
            Confirmar CPF e continuar
          </button>
          <button type="button" class="btn btn-ghost btn-block ripple" id="btn-idade-sair">Sair</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=10"></script>
  <script src="js/store.js?v=9"></script>
  <script src="js/frontend-api.js?v=34"></script>
  <script src="js/ui.js?v=31"></script>
  <script src="js/date-picker.js?v=3"></script>
  <script src="js/confirmar-idade.js?v=7"></script>
  <script src="js/offline-guard.js?v=6"></script>
  <script src="js/maintenance-guard.js?v=9"></script>
</body>
</html>
